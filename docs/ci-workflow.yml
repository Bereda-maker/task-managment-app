# To enable CI: copy this file to .github/workflows/ci.yml
# (it lives in docs/ because the token used for the first push had no `workflow` scope,
#  and GitHub refuses to let such a token create files under .github/workflows/).

name: CI

# One pipeline, both suites, on every pull request (and on pushes to main).
# Trade-off of the monorepo: a change touching web + api is one PR and one green check, at the
# cost of both suites running even when only one side changed.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Bun + real Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskboard
          POSTGRES_PASSWORD: taskboard
          POSTGRES_DB: taskboard_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U taskboard -d taskboard_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://taskboard:taskboard@localhost:5433/taskboard_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
        working-directory: apps/api
      - name: Test (migrations run automatically against the service container)
        run: bun test
        working-directory: apps/api

  web:
    name: Web (Vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Test
        run: bun run test
        working-directory: apps/web
      - name: Typecheck + production build
        run: bun run build
        working-directory: apps/web
